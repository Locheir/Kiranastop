# -------------------------------
# Namespace (auto-created)
# -------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: "2401061"

---
# -------------------------------
# Kirana Stop Deployment
# -------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirana-stop-deployment
  namespace: "2401061"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kirana-stop

  template:
    metadata:
      labels:
        app: kirana-stop
    spec:
      imagePullSecrets:
        - name: nexus-secret   # ⚠️ DO NOT CHANGE

      containers:
        - name: kirana-stop
          image: 127.0.0.1:30085/2401061/kirana-stop:latest

          ports:
            - containerPort: 3000

          env:
            env:
            - name: PORT
              value: "3000"

            - name: JWT_SECRET_KEY
              value: "jwt_secret_key_here"

            - name: SESSION_SECRET_KEY
              value: "session_secret_key_here"

            - name: EMAIL_USER
              value: "your_email@gmail.com"

            - name: EMAIL_PASS
              value: "email_password_here"

            - name: SECRET_RESET_KEY
              value: "reset_secret_key_here"

            - name: BASE_URL
              value: "http://2401061.imcc.com"

            - name: DEBUG
              value: "0"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30

          volumeMounts:
            - name: app-storage
              mountPath: /app/data

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: app-pvc